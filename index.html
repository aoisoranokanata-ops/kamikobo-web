<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>紙工房 Web</title>
<meta name="description" content="iPad で使う手書きノート・PDF 書き込みアプリ">
<meta name="theme-color" content="#2a2c31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="紙工房">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 本棚 -->
<section id="library">
  <header class="libbar">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>紙工房</span></div>
    <nav id="lib-crumbs" class="crumbs"></nav>
    <input id="lib-search" type="search" placeholder="ノート・フォルダを検索" autocomplete="off">
    <button id="lib-sort" class="ghost" title="並べ替え">⇅</button>
    <button id="lib-timer" class="ghost" title="タイマー・ストップウォッチ・ポモドーロ">⏲</button>
    <button id="lib-trash" class="ghost" title="ゴミ箱">🗑</button>
    <button id="lib-settings" class="ghost" title="設定">⚙</button>
    <button id="lib-new" class="primary">＋ 新規</button>
  </header>
  <main id="shelf" class="shelf"></main>
</section>

<!-- ノート -->
<section id="editor" hidden>
  <header class="topbar">
    <div class="tb-left">
      <button id="btn-back" class="ghost" title="本棚へ">‹ 本棚</button>
      <button id="note-title" class="title" title="名前を変更"></button>
      <button id="page-ind" class="ghost page-ind" title="ページ全体を一覧"></button>
      <span id="save-state" class="save-state"></span>
    </div>
    <div id="tools" class="tb-tools">
      <button data-tool="pen" title="ペン（P）。もう一度押すとペンの種類">✒️</button>
      <button data-tool="hl" title="蛍光ペン（H）">🖍</button>
      <button data-tool="eraser" title="消しゴム（E）">◻︎</button>
      <button data-tool="lasso" title="なげなわ（L）: 囲んで選び、移動・拡大縮小・回転・色・コピーなど"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4c4.8 0 8.5 2.4 8.5 5.4S16.8 15 12 15c-1.6 0-3-.2-4.3-.6" stroke-dasharray="2.6 2.4"/><path d="M7.7 14.4C5 13.5 3.5 11.6 3.5 9.4 3.5 6.4 7.2 4 12 4" stroke-dasharray="2.6 2.4"/><path d="M7.7 14.4c-.9 1.3-1 2.8.2 3.6 1.4.9 1.1 2.6-.6 3.2"/></svg></button>
      <button data-tool="shape" title="図形（S）: ドラッグで直線・矢印・四角・円・三角など"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="9" height="9" rx="1"/><circle cx="16.5" cy="7.5" r="4.5"/></svg></button>
      <button data-tool="text" title="文字（T）" class="t-text">T</button>
      <button data-tool="laser" title="レーザーポインター（K）">🔴</button>
      <button data-tool="hand" title="手のひら（スペース）">✋</button>
    </div>
    <div class="tb-right">
      <button id="btn-timer" class="ghost" title="タイマー・ストップウォッチ・ポモドーロ">⏲</button>
      <button id="btn-rec" class="ghost" title="録音（書いた線と音声が同期します）">🎙</button>
      <button id="btn-mark" class="ghost" title="このページにしおり（B）">🔖</button>
      <button id="btn-search" class="ghost" title="ノートの中を検索（⌘F）">🔍</button>
      <button id="btn-insert" class="ghost" title="画像・PDF を挿入">🖼</button>
      <button id="btn-share" class="ghost" title="PDF に書き出す・共有">⤴</button>
      <button id="btn-undo" class="ghost" title="元に戻す（⌘Z）">↶</button>
      <button id="btn-redo" class="ghost" title="やり直す（⇧⌘Z）">↷</button>
      <button id="btn-addpage" class="ghost" title="後ろにページを追加">＋</button>
      <button id="btn-pages" class="ghost" title="ページの一覧">▤</button>
      <button id="btn-more" class="ghost" title="ページ・設定">⋯</button>
    </div>
  </header>
  <div id="quick" class="quick"></div>
  <div id="stage">
    <canvas id="base"></canvas>
    <canvas id="over"></canvas>
    <textarea id="text-editor" hidden spellcheck="false" autocapitalize="off" placeholder="文字を入力"></textarea>
  </div>
  <div id="zoomwin" class="zoomwin" hidden>
    <canvas id="zw-canvas"></canvas>
    <div class="zw-bar">
      <button id="zw-left" class="ghost" title="枠を左へ">←</button>
      <button id="zw-right" class="ghost" title="枠を右へ">→</button>
      <button id="zw-newline" class="ghost" title="次の行の左へ">↵</button>
      <span class="zw-sep"></span>
      <button id="zw-bigger" class="ghost" title="もっと大きく">＋</button>
      <button id="zw-smaller" class="ghost" title="小さく">－</button>
      <span class="zw-sep"></span>
      <button id="zw-close" class="ghost" title="拡大窓を閉じる">✕</button>
    </div>
  </div>
  <div id="selbar" class="selbar" hidden>
    <span id="sel-count" class="muted"></span>
    <button id="sel-color">色</button>
    <button id="sel-dup">複製</button>
    <button id="sel-more" title="スクリーンショット・太さ・重なり・リンク">⋯</button>
    <button id="sel-copy">コピー</button>
    <button id="sel-cut">切り取り</button>
    <button id="sel-del" class="danger">削除</button>
  </div>
  <aside id="pagepanel" class="pagepanel" hidden>
    <div class="pp-head"><span>ページ</span><button id="pp-marks" class="small" title="しおりのページだけ">🔖</button><button id="pp-select" class="small">選ぶ</button><button id="pp-add" class="small">＋ 最後に追加</button><button id="pp-close" class="ghost">✕</button></div>
    <div class="pp-tabs"><button id="pp-tab-pages" class="small on">ページ</button><button id="pp-tab-toc" class="small">目次</button><button id="pp-grid" class="small" title="ページ全体を大きく一覧">⊞ 一覧</button></div>
    <div id="pp-selbar" class="pp-selbar" hidden>
      <span id="pp-selcount" class="muted"></span>
      <button data-act="pdf" class="small">PDF</button>
      <button data-act="extract" class="small">新しいノートへ</button>
      <button data-act="rotate" class="small">↻</button>
      <button data-act="delete" class="small danger">削除</button>
    </div>
    <div id="pp-list" class="pp-list"></div>
  </aside>
  <aside id="recpanel" class="pagepanel searchpanel" hidden>
    <div class="pp-head"><span>録音・文字起こし</span><button id="rp-new" class="small">● 始める</button><button id="rp-close" class="ghost">✕</button></div>
    <div id="rp-list" class="sp-list"></div>
  </aside>
  <div id="recbar" class="recbar" hidden>
    <span class="rec-dot"></span><span id="rb-time">0:00</span>
    <span id="rb-text" class="rb-text"></span>
    <button id="rb-pause" class="small">一時停止</button>
    <button id="rb-stop" class="small danger">停止</button>
  </div>
  <div id="playbar" class="playbar" hidden>
    <button id="pb-back" class="ghost" title="10 秒もどる">↺10</button>
    <button id="pb-play" class="ghost pb-play" title="再生・一時停止">▶</button>
    <button id="pb-fwd" class="ghost" title="10 秒すすむ">10↻</button>
    <span id="pb-time" class="pb-time">0:00</span>
    <input id="pb-seek" type="range" min="0" max="1000" value="0">
    <span id="pb-dur" class="pb-time">0:00</span>
    <button id="pb-rate" class="small" title="速さ">1×</button>
    <button id="pb-sync" class="small on" title="書いた線を音声に合わせて見せる">線の再生</button>
    <span id="pb-name" class="pb-name muted"></span>
    <button id="pb-close" class="ghost" title="閉じる">✕</button>
  </div>
  <aside id="searchpanel" class="pagepanel searchpanel" hidden>
    <div class="pp-head"><input id="sp-input" type="search" placeholder="ノートの中の文字を検索" autocomplete="off"><button id="sp-close" class="ghost">✕</button></div>
    <div id="sp-list" class="sp-list"></div>
  </aside>
  <div id="grid" class="grid-view" hidden>
    <div class="grid-head"><b id="grid-title">ページ一覧</b><button id="grid-marks" class="small">🔖 しおりだけ</button><button id="grid-close" class="ghost">✕</button></div>
    <div id="grid-list" class="grid-list"></div>
  </div>
  <div id="badge" class="badge"></div>
</section>

<div id="update-bar" class="update-bar" hidden>新しい版になりました <button onclick="location.reload()">読み込み直す</button><button class="ghost" onclick="this.parentElement.hidden=true">✕</button></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/paper.js"></script>
<script src="js/ink.js"></script>
<script src="js/notebook.js"></script>
<script src="js/view.js"></script>
<script src="js/shapes.js"></script>
<script src="js/tools.js"></script>
<script src="js/objects.js"></script>
<script src="js/ruler.js"></script>
<script src="js/zoomwin.js"></script>
<script src="js/templates.js"></script>
<script src="js/recorder.js"></script>
<script src="js/timer.js"></script>
<script src="js/search.js"></script>
<script src="js/pdfdoc.js"></script>
<script src="js/exporter.js"></script>
<script src="js/gdrive.js"></script>
<script src="js/library.js"></script>
<script src="js/app.js"></script>
</body>
</html>
